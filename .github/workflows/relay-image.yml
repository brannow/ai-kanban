# Builds and publishes the relay image (docs/sync.md) to ghcr.io/<owner>/ai-kanban-relay.
#
#   push to main      -> :edge and :sha-<short>
#   tag v1.2.3        -> :1.2.3, :1.2 and :latest
#
# Each architecture builds on a native runner. Rust under QEMU emulation takes many times
# longer, and native arm64 runners are free for public repositories. The two images are then
# joined into one multi-arch tag, so `docker pull` picks the right one on its own.
name: relay-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "crates/**", "Cargo.toml", "Cargo.lock", "Dockerfile", ".dockerignore", ".github/workflows/relay-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ai-kanban-relay

jobs:
  test:
    runs-on: ubuntu-24.04
    # The Dockerfile's builder, so CI and the image compile with the same toolchain rather than
    # whatever Rust the runner happens to have preinstalled.
    container: rust:1.99-trixie
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --workspace

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      # Pushed by digest only; the tags are attached once both architectures exist.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
