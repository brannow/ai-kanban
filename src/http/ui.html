<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-kanban</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel2: #21252c; --line: #2c313a;
    --fg: #dfe3ea; --dim: #8a93a3; --dim2: #626b7a;
    --accent: #6aa9ff; --user: #d19a66; --bug: #e06c75; --idea: #c678dd;
    --chore: #56b6c2; --urgent: #e06c75; --high: #d19a66; --ok: #98c379;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel2: #f0f2f5; --line: #dde1e7;
      --fg: #1c2027; --dim: #5c6472; --dim2: #8a93a3; --accent: #2f6fd0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; gap: 12px; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  select, input, button, textarea {
    font: inherit; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #07101f; border-color: var(--accent); font-weight: 600; }
  button.danger:hover { border-color: var(--bug); color: var(--bug); }
  button:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { border-color: var(--line); }
  .grow { flex: 1; }
  .dim { color: var(--dim); }
  .dim2 { color: var(--dim2); }
  #live { font-size: 11px; color: var(--dim2); }
  #live.on { color: var(--ok); }

  #columns { display: flex; gap: 12px; padding: 14px; align-items: flex-start; overflow-x: auto; }
  .col { flex: 1 1 0; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .col > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 0;
    padding: 9px 11px; border-bottom: 1px solid var(--line); color: var(--dim);
    display: flex; justify-content: space-between;
  }
  .col.done > h2, .col.archived > h2 { opacity: .6; }
  .cards { padding: 8px; display: flex; flex-direction: column; gap: 7px; min-height: 12px; }
  .card {
    background: var(--panel2); border: 1px solid var(--line); border-left-width: 3px;
    border-radius: 6px; padding: 8px 10px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card .t { display: block; margin-bottom: 5px; word-break: break-word; }
  .card .m { font-size: 11px; color: var(--dim2); display: flex; gap: 8px; flex-wrap: wrap; }
  .card.bug { border-left-color: var(--bug); }
  .card.idea { border-left-color: var(--idea); }
  .card.chore { border-left-color: var(--chore); }
  .card.task { border-left-color: var(--line); }
  .pri-urgent { color: var(--urgent); font-weight: 600; }
  .pri-high { color: var(--high); }
  .badge-user { color: var(--user); }
  .tag { color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .empty { padding: 10px; color: var(--dim2); font-size: 11px; }
  .more { display: block; width: calc(100% - 16px); margin: 0 8px 8px; color: var(--dim); font-size: 11px; }
  /* The header count is where the truncation becomes visible, so it is also where you act
     on it -- the bottom button is 50 cards away from the notice that sends you looking for
     it. Styled as the header text it replaces rather than as a button parked in a header. */
  .count-more { background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; }
  .count-more:hover { color: var(--accent); text-decoration: underline; }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 50vw; min-width: min(420px, 100%);
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px 18px; z-index: 20;
    box-shadow: -12px 0 32px rgba(0,0,0,.35);
  }
  #panel[hidden] { display: none; }
  /* Dims the board while the drawer is open, and is what an outside click lands on. Shown by
     the drawer's own `hidden` rather than toggled alongside it: the drawer is hidden from a
     dozen places, and a second flag would drift out of step with it. */
  #scrim { position: fixed; inset: 0; z-index: 19; background: rgba(20,22,26,.55); }
  #panel[hidden] + #scrim { display: none; }
  #panel h2 { font-size: 15px; margin: 0 0 4px; }
  #panel section { margin-top: 18px; }
  #panel h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 5px;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  pre.body {
    white-space: pre-wrap; word-break: break-word; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 0; font-size: 12px;
  }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ev:last-child { border-bottom: 0; }
  .ev .k { color: var(--accent); }
  .note { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 9px; margin-bottom: 8px; }
  .note .paths { font-size: 11px; color: var(--dim2); margin-top: 5px; word-break: break-all; }
  .hit { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 9px; margin-bottom: 7px; }
  .hit mark { background: transparent; color: var(--accent); font-weight: 600; }
  .hit.open { cursor: pointer; }
  .hit.open:hover { border-color: var(--accent); }
  #err {
    position: fixed; bottom: 14px; left: 14px; z-index: 40; max-width: 520px;
    background: var(--panel); border: 1px solid var(--bug); color: var(--bug);
    border-radius: 6px; padding: 9px 12px; font-size: 12px;
  }
  #err[hidden] { display: none; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog input, dialog textarea, dialog select { width: 100%; margin-bottom: 8px; }
/* The scope control. Deliberately labelled rather than a bare dropdown: an unlabelled
   select next to the project one reads as a second filter, and this both narrows the board
   and decides where new work is filed. */
.ws { display:flex; align-items:center; gap:6px; font-size:12px; color:#6b7280; }
.ws select { font-size:12px; }
.wsfield { margin-top:10px; }
  .repo { color: var(--chore); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .norepo { color: var(--high); }
  .xref { color: var(--accent); }
  .pick { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; font-size: 12px; }
  .pick input, dialog .pick input { width: auto; margin: 0; }
  .reporow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .reporow .p { color: var(--dim2); font-size: 11px; word-break: break-all; flex: 1 1 200px; }
  .board { color: var(--idea); font-weight: 600; }
  /* `.ws` and friends set `display`, which beats the UA's rule for [hidden]; this keeps
     `el.hidden = true` meaning what it says everywhere. */
  [hidden] { display: none !important; }
</style>

<header>
  <h1>ai-kanban</h1>
  <select id="project"></select>
  <button id="repobtn" title="the local checkouts this board's tickets live in">repos</button>
  <label class="ws">working in <select id="workstream"></select></label>
  <span id="live">connecting</span>
  <span class="grow"></span>
  <input id="search" placeholder="recall across boards…" size="26">
  <button id="new">+ task</button>
</header>

<div id="columns"></div>
<div id="panel" hidden></div>
<div id="scrim"></div>
<div id="err" hidden></div>

<dialog id="newdlg">
  <form method="dialog">
    <h3 style="margin-top:0">New task</h3>
    <input name="title" placeholder="What needs doing" required autofocus>
    <textarea name="body" rows="4" placeholder="Detail worth keeping: what you saw, where, why it matters"></textarea>
    <div class="row">
      <select name="type"></select>
      <select name="priority"></select>
      <select name="status"></select>
    </div>
    <label class="ws wsfield" id="newboardfield" hidden>on board <select name="board"></select></label>
    <label class="ws wsfield" id="newwsfield">joins workstream <select name="workstream"></select></label>
    <input name="xref" placeholder="tracker issue, e.g. 48213 or PROJ-123 (optional)" style="margin-top:10px">
    <div class="dim2" style="font-size:11px">repos this touches</div>
    <div id="newrepos" class="row" style="margin-top:4px"></div>
    <div class="row" style="margin-top:10px; justify-content:flex-end">
      <button value="cancel">Cancel</button>
      <button value="ok" class="primary">File it</button>
    </div>
  </form>
</dialog>

<!-- Served separately, so the page needs no inline script and its Content-Security-Policy
     can forbid every one: an injected handler (<img onerror=...>) then does not run. -->
<script src="/app.js"></script>
