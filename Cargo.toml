[package]
name = "ai-kanban"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
rmcp = { version = "3.1.4", features = ["macros", "schemars", "server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.27.0"
